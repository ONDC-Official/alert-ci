name: "Google Chat CI Alert"
description: "Sends Google Chat Card v2 alerts on workflow success, failure, or cancellation"
author: "ONDC"

inputs:
  gchat_webhook:
    description: "Google Chat space incoming webhook URL"
    required: true
  job_status:
    description: "Status of the job (pass job.status from caller workflow)"
    required: true
  custom_message:
    description: "Optional custom message to append to the notification"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Send Google Chat Notification
      shell: bash
      env:
        WEBHOOK_URL: ${{ inputs.gchat_webhook }}
        JOB_STATUS: ${{ inputs.job_status }}
        CUSTOM_MSG: ${{ inputs.custom_message }}
        REPO: ${{ github.repository }}
        WORKFLOW: ${{ github.workflow }}
        RUN_NUMBER: ${{ github.run_number }}
        REF_NAME: ${{ github.ref_name }}
        EVENT_NAME: ${{ github.event_name }}
        ACTOR: ${{ github.actor }}
        SHA: ${{ github.sha }}
        SERVER_URL: ${{ github.server_url }}
        RUN_ID: ${{ github.run_id }}
      run: |
        if [ "$JOB_STATUS" = "success" ]; then
          HEADER_TITLE="✅ CI Workflow Passed"
        elif [ "$JOB_STATUS" = "failure" ]; then
          HEADER_TITLE="❌ CI Workflow Failed"
        else
          HEADER_TITLE="⚠️ CI Workflow Cancelled"
        fi

        RUN_URL="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"

        PAYLOAD=$(cat <<'EOF'
        {
          "cardsV2": [
            {
              "cardId": "ci-alert-RUN_ID_PLACEHOLDER",
              "card": {
                "header": {
                  "title": "HEADER_TITLE_PLACEHOLDER",
                  "subtitle": "Repository: REPO_PLACEHOLDER"
                },
                "sections": [
                  {
                    "widgets": [
                      {
                        "decoratedText": {
                          "topLabel": "Workflow",
                          "text": "WORKFLOW_PLACEHOLDER (#RUN_NUMBER_PLACEHOLDER)"
                        }
                      },
                      {
                        "decoratedText": {
                          "topLabel": "Branch / Event",
                          "text": "REF_NAME_PLACEHOLDER (EVENT_NAME_PLACEHOLDER)"
                        }
                      },
                      {
                        "decoratedText": {
                          "topLabel": "Triggered by",
                          "text": "ACTOR_PLACEHOLDER"
                        }
                      },
                      {
                        "decoratedText": {
                          "topLabel": "Commit",
                          "text": "SHA_PLACEHOLDER"
                        }
                      }
                    ]
                  },
                  {
                    "widgets": [
                      {
                        "buttonList": {
                          "buttons": [
                            {
                              "text": "View Action Run",
                              "onClick": {
                                "openLink": {
                                  "url": "RUN_URL_PLACEHOLDER"
                                }
                              }
                            }
                          ]
                        }
                      }
                    ]
                  }
                ]
              }
            }
          ]
        }
        EOF
        )

        PAYLOAD="${PAYLOAD//RUN_ID_PLACEHOLDER/$RUN_ID}"
        PAYLOAD="${PAYLOAD//HEADER_TITLE_PLACEHOLDER/$HEADER_TITLE}"
        PAYLOAD="${PAYLOAD//REPO_PLACEHOLDER/$REPO}"
        PAYLOAD="${PAYLOAD//WORKFLOW_PLACEHOLDER/$WORKFLOW}"
        PAYLOAD="${PAYLOAD//RUN_NUMBER_PLACEHOLDER/$RUN_NUMBER}"
        PAYLOAD="${PAYLOAD//REF_NAME_PLACEHOLDER/$REF_NAME}"
        PAYLOAD="${PAYLOAD//EVENT_NAME_PLACEHOLDER/$EVENT_NAME}"
        PAYLOAD="${PAYLOAD//ACTOR_PLACEHOLDER/$ACTOR}"
        PAYLOAD="${PAYLOAD//SHA_PLACEHOLDER/$SHA}"
        PAYLOAD="${PAYLOAD//RUN_URL_PLACEHOLDER/$RUN_URL}"

        curl -s -X POST -H 'Content-Type: application/json; charset=UTF-8' \
          -d "$PAYLOAD" \
          "$WEBHOOK_URL"

